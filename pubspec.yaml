name: samarth_player
description: Minimal Music Player, YouTube Downloader & Karaoke Studio.
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  youtube_explode_dart: ^3.1.0
  just_audio: ^0.10.6
  file_picker: ^8.1.2
  path_provider: ^2.1.4
  permission_handler: ^11.3.1
  record: ^5.1.2

flutter:
  uses-material-design: true
