name: Build SAMARTH APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Android project structure
        run: |
          mv lib/main.dart /tmp/main.dart
          mv pubspec.yaml /tmp/pubspec.yaml
          flutter create --org com.samarth --project-name samarth_player .
          mv /tmp/main.dart lib/main.dart
          mv /tmp/pubspec.yaml pubspec.yaml

      - name: Inject Android Permissions & Set App Name to SAMARTH
        run: |
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO"\/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"\/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"\/>\n    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO"\/>\n    <application/g' android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="samarth_player"/android:label="SAMARTH"/g' android/app/src/main/AndroidManifest.xml

      - name: Set Minimum Android SDK to 23 (Required by Recorder)
        run: |
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/g' android/app/build.gradle || true
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/g' android/app/build.gradle || true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK for Download
        uses: actions/upload-artifact@v4
        with:
          name: SAMARTH-App-APK
          path: build/app/outputs/flutter-apk/app-release.apk
